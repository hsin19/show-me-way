name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Deploy-specific permissions are granted only on the deploy job
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Same definition pr.yml gates a PR with, so a direct push to `main` is held to
  # the same bar -- and its Codecov upload is the baseline every later PR is diffed
  # against, since this is the only place the suite runs on the default branch.
  check:
    uses: ./.github/workflows/check.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm version comes from package.json's packageManager field
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build only: `check` above already verified this tree. This one exists because
      # what ships needs BASE_PATH, which the check build has no reason to carry.
      - name: Build
        run: pnpm run build
        env:
          # GitHub Pages serves project sites under /<repo-name>/
          BASE_PATH: ${{ github.event.repository.name }}
          # Shown in App 設定 › 關於 App. Passed explicitly rather than left to
          # vite.config.ts's `git rev-parse` fallback, so the version on the
          # deployed site is the commit Actions actually built.
          VITE_GIT_SHA: ${{ github.sha }}

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
