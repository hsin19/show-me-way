name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Deploy-specific permissions are granted only on the deploy job
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm version comes from package.json's packageManager field
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Cache dprint plugins
        uses: actions/cache@v6
        with:
          path: ~/.cache/dprint
          key: dprint-${{ runner.os }}-${{ hashFiles('.dprint.jsonc') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks and build
        run: pnpm run check:ci
        env:
          # GitHub Pages serves project sites under /<repo-name>/
          BASE_PATH: ${{ github.event.repository.name }}
          # Shown in App 設定 › 關於 App. Passed explicitly rather than left to
          # vite.config.ts's `git rev-parse` fallback, so the version on the
          # deployed site is the commit Actions actually built.
          VITE_GIT_SHA: ${{ github.sha }}

      # Codecov's PR statuses diff against the newest report on the default branch,
      # and this is the only job that runs check:ci on main -- so the baseline is
      # uploaded from here rather than by giving ci.yml a second, duplicate run on
      # every push. !cancelled() so a later failure still ships what the tests made.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: test-report.junit.xml
          fail_ci_if_error: false

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
