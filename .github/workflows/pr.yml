name: Pull Request

# Everything a PR gets: the shared gate in check.yml, plus the one policy that only
# makes sense on a PR -- the Dependabot auto-merge. Not named `ci.yml` because CI
# is not what distinguishes it: deploy.yml calls the same gate. The trigger is
# what distinguishes it.
on:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of the same PR, but never interfere with the 'pages' deploy queue
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Merges a green Dependabot PR with a dedicated PAT (Dependabot secret, NOT the
  # default GITHUB_TOKEN) so the resulting push to main still triggers deploy.yml.
  # See .github/workflows/README.md for the token setup. The pages-actions group
  # (dependabot.yml) is excluded: those actions only ever run on a push to main,
  # so a green PR proves nothing about them — they get a human look instead.
  auto-merge:
    name: Auto-merge Dependabot
    needs: [check]
    if: ${{ success() && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.head_ref, 'pages-actions') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      # The check ran on this PR merged into main as main stood when the run began:
      # GITHUB_SHA is that test merge, and its first parent is that main. If main has
      # moved since, the squash would land a tree no check saw -- two bumps of the
      # same transitive package can merge as clean text into a lockfile with
      # duplicate keys. Dependabot rebases instead, and its push re-runs this gate.
      - name: Squash-merge the PR, or have Dependabot rebase it onto main
        run: |
          tested_base=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.parents[0].sha')
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASE_REF" --jq .sha)
          if [ "$tested_base" != "$main" ]; then
            gh pr comment "$PR_URL" --body "@dependabot rebase"
            exit 0
          fi
          gh pr merge --squash --delete-branch --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
