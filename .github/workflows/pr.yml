name: Pull Request

# Everything a PR gets: the shared gate in check.yml, plus the one policy that only
# makes sense on a PR -- the Dependabot auto-merge. Not named `ci.yml` because CI
# is not what distinguishes it: deploy.yml calls the same gate. The trigger is
# what distinguishes it.
on:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of the same PR, but never interfere with the 'pages' deploy queue
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Merges a green Dependabot PR through the shared workflow in hsin19/actions;
  # `needs` is what "green" means here. AUTOMERGE_TOKEN is a Dependabot secret,
  # not GITHUB_TOKEN, so the merge's push to main still triggers deploy.yml.
  # -manual groups are left for a human; see .github/workflows/README.md.
  auto-merge:
    needs: [check]
    uses: hsin19/actions/.github/workflows/dependabot-automerge.yml@v1
    secrets:
      token: ${{ secrets.AUTOMERGE_TOKEN }}
