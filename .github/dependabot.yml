version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    ignore:
      # 專案使用 Node 24（LTS），@types/node 跟隨同一個 major，不升到非 LTS 的 25.x
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      svelte:
        patterns:
          - 'svelte'
          - 'svelte-*'
          - '@sveltejs/*'
      vite:
        patterns:
          - 'vite'
          - 'vite-*'
          - 'vitest'
          - '@vite-pwa/*'
          - 'workbox-*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
      non-major:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
        exclude-patterns:
          - 'actions/configure-pages'
          - 'actions/deploy-pages'
          - 'actions/upload-pages-artifact'
      # deploy.yml 專用的三支 action 只在 push main 時執行，PR 檢查永遠跑不到它們，
      # 升級等於未經驗證直上生產部署——獨立成組，pr.yml 依組名跳過 auto-merge。
      pages-actions:
        patterns:
          - 'actions/configure-pages'
          - 'actions/deploy-pages'
          - 'actions/upload-pages-artifact'
